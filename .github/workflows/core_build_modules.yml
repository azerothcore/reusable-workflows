name: core-build-modules
on:
  workflow_call:
    inputs:
      module_repo:
        required: true
        type: string
      module_branch:
        required: false
        type: string
      module_path:
        description: 'Folder inside the repo that holds the module (src/, conf/, ...), if not the repo root. Its name is used as the module name.'
        required: false
        type: string
      module_data:
        description: 'Archive (.zip, .tar.gz, .tgz) with the module''s server data (dbc/, maps/, vmaps/, mmaps/), copied over the client data before the dry run: a URL, or a path relative to the module repo root.'
        required: false
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            compiler:
              CC: clang-20
              CXX: clang++-20
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-${{ matrix.compiler.CC }}
    # if: !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 'azerothcore/azerothcore-wotlk'
          ref: 'master'
          submodules: 'recursive'
      - uses: actions/checkout@v4
        with:
          repository: 'azerothcore/reusable-workflows'
          path: 'reusable-workflows'
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          path: 'modules/${{ inputs.module_repo }}'
          ref: ${{ inputs.module_branch }}
      - name: Unpack module data
        id: module_data
        if: inputs.module_data != ''
        env:
          MODULE_REPO: ${{ inputs.module_repo }}
          MODULE_DATA: ${{ inputs.module_data }}
        run: |
          name="${MODULE_DATA%%[?#]*}"
          case "$name" in
            *.zip|*.tar.gz|*.tgz) ;;
            *)
              echo "module_data '$MODULE_DATA' must be a .zip, .tar.gz or .tgz archive"
              exit 1
              ;;
          esac
          if [[ "$MODULE_DATA" =~ ^https?:// ]]; then
            archive="$RUNNER_TEMP/module-data-archive"
            curl -fsSL --retry 3 -o "$archive" "$MODULE_DATA"
          else
            archive="modules/$MODULE_REPO/$MODULE_DATA"
            if [[ ! -f "$archive" ]]; then
              echo "module_data '$MODULE_DATA' is not a file in the module repo"
              exit 1
            fi
          fi
          data_dir="$RUNNER_TEMP/module-data"
          mkdir "$data_dir"
          case "$name" in
            *.zip) unzip -q "$archive" -d "$data_dir" ;;
            *) tar -xzf "$archive" -C "$data_dir" ;;
          esac
          # the archive may wrap the data folders in a parent folder
          data_root="$(find "$data_dir" -type d -name dbc -printf '%d %h\n' | sort -n | head -1 | cut -d' ' -f2-)"
          if [[ -z "$data_root" ]]; then
            echo "module_data '$MODULE_DATA' has no dbc/ folder"
            exit 1
          fi
          echo "dir=$data_root" >> "$GITHUB_OUTPUT"
      - name: Use module subfolder
        if: inputs.module_path != ''
        env:
          MODULE_REPO: ${{ inputs.module_repo }}
          MODULE_PATH: ${{ inputs.module_path }}
        run: |
          mv "modules/$MODULE_REPO" "$RUNNER_TEMP/module-repo"
          mv "$RUNNER_TEMP/module-repo/$MODULE_PATH" "modules/$(basename "$MODULE_PATH")"
      - name: Cache
        uses: actions/cache@v4
        with:
          path: var/ccache
          key: ccache:${{ matrix.compiler.CC }}:${{ github.ref }}:${{ github.sha }}
          restore-keys: |
            ccache:${{ matrix.compiler.CC }}:${{ github.ref }}
            ccache:${{ matrix.compiler.CC }}
      - uses: ./.github/actions/linux-build
        with:
          CC: ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
          extra-data-dir: ${{ steps.module_data.outputs.dir }}
      - name: cpp check
        run: |
          sudo apt update -y
          sudo apt install -y cppcheck
          cppcheck --force --inline-suppr --suppressions-list=reusable-workflows/cppchecksuppressions.txt --output-file=report.txt modules/
          if [ -s report.txt ]; then
            cat report.txt
            exit 1
          fi
